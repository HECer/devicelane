name: Desktop release
on:
  pull_request:
  workflow_dispatch:
    inputs:
      production: { description: Build signed production artifacts, required: true, type: boolean, default: false }
permissions: { contents: read, id-token: write }

jobs:
  unsigned-native:
    if: github.event_name == 'pull_request' || inputs.production != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, bundles: msi }
          - { os: macos-15, bundles: dmg }
          - { os: ubuntu-24.04, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22.20.0, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Locked frontend
        working-directory: desktop
        run: npm ci
      - name: Locked CLI and service
        run: cargo build --release --locked --bin devicelane --bin devicelane-service
      - name: Unsigned native installer
        working-directory: desktop
        run: npm exec tauri build -- --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Native artifact first-run smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\desktop-release-smoke.ps1 -ExerciseLifecycle -Artifact (Get-ChildItem target\release\bundle\msi\*.msi -ErrorAction Stop).FullName
      - name: Native artifact first-run smoke
        if: runner.os != 'Windows'
        shell: bash
        run: DEVICELANE_DESKTOP_ARTIFACT="$PWD/target/release/bundle" sh scripts/desktop-release-smoke.sh --exercise-lifecycle
      - name: Build evidence, SBOM, and checksums
        shell: bash
        run: |
          mkdir -p desktop-dist/SBOM
          { rustc -vV; cargo -V; node -v; npm -v; printf 'runner=%s\nimage=%s\n' "$RUNNER_OS" "$ImageOS"; sha256sum Cargo.lock desktop/package-lock.json rust-toolchain.toml .github/workflows/desktop-release.yml; } > desktop-dist/BUILD-INPUTS.txt
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo cyclonedx --all --format json
          find . -name '*.cdx.json' -type f -exec cp {} desktop-dist/SBOM/ \;
          find target/release/bundle -type f -exec cp {} desktop-dist/ \;
          cd desktop-dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: 'unsigned-ci-${{ runner.os }}', path: desktop-dist, if-no-files-found: error, retention-days: 7 }

  production-native:
    if: github.event_name == 'workflow_dispatch' && inputs.production == true
    environment: production-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, bundles: msi }
          - { os: macos-15, bundles: dmg }
          - { os: ubuntu-24.04, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22.20.0, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Locked frontend
        working-directory: desktop
        run: npm ci
      - name: Require production credentials
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Refusing production release without signing and notarization inputs" >&2; exit 1; }
          case "$RUNNER_OS" in
            macOS) for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do test -n "${!name}" || exit 1; done ;;
            Windows) test -n "$WINDOWS_CERTIFICATE" && test -n "$WINDOWS_CERTIFICATE_PASSWORD" || exit 1 ;;
          esac
      - name: Import Apple identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/devicelane-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/apple-signing.p12"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/apple-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Import Windows identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'devicelane-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) | Out-Null
      - name: Locked CLI and service
        run: cargo build --release --locked --bin devicelane --bin devicelane-service
      - name: Signed native installer
        working-directory: desktop
        run: npm exec tauri build -- --bundles ${{ matrix.bundles }} -- --locked
      - name: Sign MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem target\release\bundle\msi\*.msi | ForEach-Object { & signtool sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Validate notarization
        if: runner.os == 'macOS'
        shell: bash
        run: find target/release/bundle/dmg -name '*.dmg' -exec xcrun stapler validate {} \;
      - name: Verify staged binaries
        shell: bash
        run: |
          cd desktop/src-tauri/binaries
          sha256sum devicelane-* > sidecar-manifest.sha256
          sha256sum --check sidecar-manifest.sha256
          # Signed/non-writable install roots are required. No TOCTOU security guarantee is claimed.
      - name: Native artifact first-run smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\desktop-release-smoke.ps1 -ExerciseLifecycle -Artifact (Get-ChildItem target\release\bundle\msi\*.msi -ErrorAction Stop).FullName
      - name: Native artifact first-run smoke
        if: runner.os != 'Windows'
        shell: bash
        run: DEVICELANE_DESKTOP_ARTIFACT="$PWD/target/release/bundle" sh scripts/desktop-release-smoke.sh --exercise-lifecycle
      - name: Signed evidence and SBOM
        shell: bash
        run: |
          mkdir -p desktop-dist/SBOM
          { rustc -vV; cargo -V; node -v; npm -v; printf 'runner=%s\nimage=%s\n' "$RUNNER_OS" "$ImageOS"; sha256sum Cargo.lock desktop/package-lock.json rust-toolchain.toml .github/workflows/desktop-release.yml; } > desktop-dist/BUILD-INPUTS.txt
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo cyclonedx --all --format json
          find . -name '*.cdx.json' -type f -exec cp {} desktop-dist/SBOM/ \;
          find target/release/bundle -type f -exec cp {} desktop-dist/ \;
          cd desktop-dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: 'production-${{ runner.os }}', path: desktop-dist, if-no-files-found: error }
