name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify synchronized release version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          npm_version="$(node -p "require('./npm/package.json').version")"
          test "$tag" = "$cargo_version"
          test "$tag" = "$npm_version"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: devicelane-windows-x64.zip
            archive: zip
          - os: ubuntu-latest
            asset: devicelane-linux-x64.tar.gz
            archive: tar
          - os: macos-15-intel
            asset: devicelane-macos-x64.tar.gz
            archive: tar
          - os: macos-latest
            asset: devicelane-macos-arm64.tar.gz
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - run: cargo build --release --locked --bins
      - name: Package Unix binaries
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -czf "${{ matrix.asset }}" -C target/release devicelane devicelane-service mesh-cli mesh-agent mesh-registry -C ../.. README.md LICENSE
      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/release/devicelane.exe,target/release/devicelane-service.exe,target/release/mesh-cli.exe,target/release/mesh-agent.exe,target/release/mesh-registry.exe,README.md,LICENSE -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum devicelane-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "DeviceLane ${GITHUB_REF_NAME}"
