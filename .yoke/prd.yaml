- id: STORY-21
  title: Apple-Preflight und typisierte Toolausführung liefern
  priority: 1
  acceptance:
    - tests/apple_preflight.rs prüft maschinenlesbare Zustände und konkrete
      Reparaturhinweise für macOS, vollständiges Xcode, aktives
      Developer-Verzeichnis, xcodebuild, devicectl, simctl, xcresulttool,
      xctrace und lldb-dap
    - Auf Nicht-macOS-Systemen liefert der Apple-Preflight unsupported_host
      statt einen Prozess zu starten oder zu panicen
    - AppleToolRunner startet ausschließlich fest erlaubte Apple-Programme mit
      getrennten Argumenten, bereinigtem Environment, Workspace-Grenze, Timeout
      und Abbruch
    - Versionierte Fixtures beweisen Erfolgs-, fehlende-Tool-, Lizenz- und
      Developer-Directory-Fehler ohne ein Hardware-Gate zu bestehen
  passes: true
  area: apple-core
- id: STORY-22
  title: Physische Apple-Geräte und Simulatoren normalisiert erkennen
  priority: 2
  acceptance:
    - tests/apple_discovery.rs normalisiert versionierte devicectl- und
      simctl-JSON-Fixtures in stabile DeviceSnapshot-Werte mit ID, Name,
      Plattform, OS-Version, Verbindung, Trust, Developer Mode und Verfügbarkeit
    - Parser tolerieren unbekannte Zusatzfelder und liefern bei fehlenden
      Pflichtfeldern einen stabilen malformed_tool_output-Fehler ohne
      Teilinventar
    - Geräte mit disconnected, locked, untrusted, unavailable oder
      runtime_missing veröffentlichen keine ausführbaren App-Capabilities und
      enthalten einen konkreten Repair-Hinweis
    - Die Discovery ruft Tools nur über AppleToolRunner auf und kann dieselbe
      Ausgabe als JSON über die CLI liefern
  passes: true
  needs:
    - STORY-21
  area: apple-discovery
- id: STORY-23
  title: Xcode-Projekte Schemes und Destinations entdecken
  priority: 3
  acceptance:
    - tests/apple_project_discovery.rs prüft Project-, Workspace-, Scheme-,
      Configuration- und Destination-Erkennung aus versionierten
      xcodebuild-Fixtures
    - Mehrdeutige Container oder Schemes führen zu einer Auswahlantwort mit
      stabilen IDs statt zu einer stillen Standardwahl
    - Projektpfade werden auf den geleasten Workspace begrenzt und Argumente mit
      Leerzeichen oder Metazeichen werden ohne Shell korrekt übergeben
    - Nicht verfügbare oder inkompatible Destinations liefern einen
      normalisierten Repair-Hinweis
  passes: true
  needs:
    - STORY-22
  area: apple-projects
- id: STORY-24
  title: Xcode Build und Test als resumierbaren Agent-Job ausführen
  priority: 4
  acceptance:
    - tests/apple_build.rs beweist einen typisierten xcodebuild-Plan für build
      und test mit explizitem Container, Scheme, Configuration, Destination,
      DerivedData und ResultBundle im geleasten Workspace
    - stdout und stderr werden als lückenlos sequenzierte Events gestreamt;
      Timeout und Cancel beenden den vollständigen xcodebuild-Prozessbaum genau
      einmal
    - Erfolgreiche .app-, .dSYM- und .xcresult-Ausgaben werden gehasht im
      ArtifactStore registriert und können nach Verbindungsabbruch fortgesetzt
      geladen werden
    - Signing wird ausschließlich über lokal vorhandene Identitäts- oder
      Profilreferenzen gewählt; Schlüsselmaterial und geschützte Buildvariablen
      erscheinen weder in Events noch Auditdaten
  passes: true
  needs:
    - STORY-23
  area: apple-build
- id: STORY-25
  title: iOS-Simulator Lifecycle und Entwicklungsautomation bereitstellen
  priority: 5
  acceptance:
    - tests/apple_simulator.rs prüft create, boot, bootstatus, shutdown, delete,
      install, uninstall, launch und terminate als typisierte simctl-Operationen
    - Screenshot, Logstream, Location, Privacy-Permissions sowie Media-Import
      sind capability- und lease-geschützt und auf erlaubte Dateien im Workspace
      begrenzt
    - Wiederholte idempotente Operationen liefern den vorhandenen Zustand; busy,
      boot_failed, runtime_missing und detach besitzen stabile Fehlercodes
    - Der vollständige Fake-Tool-Ablauf erfüllt die bestehende
      DeviceAdapter-Contract-Suite, markiert aber kein physisches Hardware-Gate
      als bestanden
  passes: true
  needs:
    - STORY-24
  area: apple-simulator
- id: STORY-26
  title: Physisches iPhone installieren starten stoppen und protokollieren
  priority: 6
  acceptance:
    - tests/apple_physical_device.rs prüft devicectl-Pläne für install, launch,
      terminate, uninstall, device info und App-Logstream anhand versionierter
      Tool-Fixtures
    - Jede mutierende Operation benötigt eine gültige exklusive Geräte-Lease und
      passende Apple-Capability; Beobachter dürfen ausschließlich freigegebene
      Logs lesen
    - locked, untrusted, developer_mode_disabled, signing_failed, device_busy
      und detached werden normalisiert und enthalten konkrete Reparaturhinweise
    - Bundle-ID, App-Pfad und Geräte-ID werden validiert und ausschließlich als
      getrennte Argumente an devicectl übergeben
  passes: true
  needs:
    - STORY-25
  area: apple-physical
- id: STORY-27
  title: XCTest XCUI und xcresult Artefakte integrieren
  priority: 7
  acceptance:
    - tests/apple_xctest.rs prüft build-for-testing, test-without-building,
      Testplan-, Only-Testing- und UI-Test-Auswahl als typisierte
      xcodebuild-Operationen
    - xcresulttool-Fixtures werden in stabile Suite-, Testfall-, Fehler-,
      Attachment- und Coverage-Ergebnisse mit Quellreferenzen normalisiert
    - Screenshots, Videos, Diagnosen und das rohe .xcresult werden als gehashte
      Artefakte registriert und sensible Umgebungswerte redigiert
    - Abbruch, Testfehler, Runner-Crash, Geräteverlust und inkompatibles
      Result-Schema erzeugen genau einen terminalen Status und behalten
      auswertbare Teilresultate
  passes: true
  needs:
    - STORY-26
  area: apple-testing
- id: STORY-28
  title: Kontrollierte LLDB- und xctrace-Sessions liefern
  priority: 8
  acceptance:
    - tests/apple_diagnostics.rs prüft Launch, Attach, Breakpoint, Continue,
      Pause, Stack, Variables und Disconnect über einen sitzungsgebundenen
      LLDB-DAP-Endpunkt
    - Debugendpunkte binden ausschließlich Loopback oder den verschlüsselten
      Sessionkanal, benötigen Lease und Capability und werden bei Revoke oder
      Timeout beendet
    - xctrace-Pläne für CPU, Memory, Energy und Network erzwingen Ziel, Dauer,
      Workspace-Ausgabe und Ressourcenlimit
    - Trace-, Symbol-, Crash- und Diagnoseausgaben werden als Artefakte
      registriert; fehlende Templates oder Symbole liefern stabile
      Repair-Hinweise
  passes: true
  needs:
    - STORY-27
  area: apple-diagnostics
- id: STORY-29
  title: Mac-Agent mit einem Befehl installieren und betreiben
  priority: 9
  acceptance:
    - tests/mac_bootstrap.rs und scripts/mac-bootstrap-smoke prüfen einen
      idempotenten setup-mac.sh-Aufruf für Release-Build, Doctor, Pairing,
      Benutzer-LaunchAgent, Start, Status und Upgrade
    - Der LaunchAgent verwendet absolute Pfade, KeepAlive mit Backoff,
      restriktive Dateirechte und keine Pairing-Codes, privaten Schlüssel oder
      Signing-Secrets in Plist oder Logs
    - setup-mac.sh besitzt einen nebenwirkungsfreien --dry-run und gibt bei
      Erfolg genau den nächsten Controller-Befehl sowie den Pfad eines
      redigierten Diagnosebundles aus
    - --controller setzt Pairing- und Registry-Ziel für einen entfernten
      Windows- oder Linux-Controller; bestehendes Trust-Material wird bei
      Upgrade nicht ersetzt
    - Deinstallation entfernt nur die explizit installierte LaunchAgent-Datei
      und Programmdateien; Identität und Auditdaten bleiben standardmäßig
      erhalten
  passes: true
  needs:
    - STORY-28
  area: mac-bootstrap
- id: STORY-30
  title: Versionierten Remote-Apple-Jobvertrag liefern
  priority: 10
  acceptance:
    - tests/remote_apple_protocol.rs serialisiert und validiert einen
      versionierten, typisierten Apple-Request für Discovery, Project, Build,
      Simulator, physisches Gerät, XCTest und Diagnostics ohne Raw-Shell-Feld
    - Registry und Agent behandeln Request-ID und Idempotency-Key stabil und
      lehnen unbekannte Versionen, Operationen, Capabilities, Workspace-Pfade
      und Geräte-IDs mit normalisierten Fehlern ab
    - Ein angenommener Job erhält sofort eine Job-ID; lange Apple-Prozesse
      blockieren weder Registry noch Client-Deadline und veröffentlichen
      sequenzierte Progress-Events bis genau zu einem terminalen Status
    - Bestehende Phase-1-Protokollnachrichten bleiben rückwärtskompatibel
  passes: true
  needs:
    - STORY-29
  area: remote-apple-protocol
- id: STORY-31
  title: Apple-Operationen im entfernten Mac-Agent dispatchen
  priority: 11
  acceptance:
    - tests/remote_apple_agent.rs beweist, dass der Registry-Prozess einen
      typisierten Apple-Job unverändert an den gepairten ausgehenden Mac-Agent
      zustellt und ausschließlich der Agent AppleToolRunner ausführt
    - Der Agent veröffentlicht Preflight-, Tool-, Simulator- und physische
      Geräte-Capabilities aus echter Discovery statt statischer Dummy-Argumente
      und aktualisiert sie bei Lock, Detach oder Developer-Mode-Änderung
    - Workspace-, Lease-, Capability-, Pfad- und Geräteprüfung geschieht erneut
      im Agent direkt vor der Toolausführung; Raw-Shell und beliebige Toolpfade
      sind über das Netzwerk nicht darstellbar
    - Progress, Cancel und Reconnect funktionieren während eines laufenden
      Fake-xcodebuild-Prozesses ohne doppelte Ausführung
  passes: false
  needs:
    - STORY-30
  area: remote-apple-agent
- id: STORY-32
  title: Apple-Artefakte chunked über das Mesh übertragen
  priority: 12
  acceptance:
    - tests/network_artifacts.rs lädt .app-, .dSYM-, .xcresult-, Screenshot-,
      Log- und Trace-Fixtures als Metadaten plus begrenzte Chunks über Registry
      und mTLS-Client statt als lokales Pfad- oder String-Surrogat
    - Offset, Länge, Gesamtgröße und SHA-256 werden bei jedem Resume geprüft;
      Abbruch und Reconnect setzen am bestätigten Offset ohne Duplikate fort
    - Registry puffert keine unbeschränkten Artefakte im Arbeitsspeicher und
      gibt Artefakte nur an autorisierte Teilnehmer des Jobs aus
    - Manipulierte Chunks, unbekannte Artefakte und ungültige Offsets liefern
      stabile Fehler ohne Teildatei als erfolgreich zu markieren
  passes: false
  needs:
    - STORY-31
  area: remote-artifacts
- id: STORY-33
  title: Remote-Apple-Vertikalschnitt in getrennten Prozessen bestehen
  priority: 13
  acceptance:
    - tests/remote_apple_e2e.rs startet Registry, Mac-Agent und mindestens zwei
      Clients als getrennte Prozesse mit Fake-Apple-Tools und realem
      mTLS-Pairing
    - Ein Client synchronisiert einen Manifest-Workspace, entdeckt Projekt und
      Simulator, baut, installiert, startet, liest Logs, führt XCTest aus und
      lädt die Artefakte mit geprüften Hashes zurück
    - Ein zweiter gepairter Client kann denselben Agent entdecken und zulässige
      Beobachtung ausführen; exklusive Geräteoperationen folgen deterministisch
      Lease, Queue, Revoke und Disconnect
    - Prozessmarker beweisen, dass Apple-Tools nur auf dem Agent-Host laufen;
      Registry-Neustart und Client-Reconnect verlieren keine bestätigten Events
      oder terminalen Resultate
  passes: false
  needs:
    - STORY-32
  area: remote-apple-e2e
- id: STORY-34
  title: Reales Mac-und-iPhone-Hardware-Gate bestehen
  priority: 14
  acceptance:
    - scripts/mac-hardware-gate.sh läuft auf einem echten Mac ohne
      Mock-Toolpfade und erfasst Xcode-, SDK-, Tool- und Geräteversionen in
      einem redigierten signierten Ergebnisbundle
    - Eine gebündelte minimale Development-App wird mit lokalem Signing gebaut,
      auf einem physisch angeschlossenen entsperrten iPhone installiert,
      gestartet, protokolliert und wieder beendet
    - Ein XCTest- oder XCUI-Smoke-Test läuft auf demselben physischen Gerät und
      .xcresult, App-Log, Screenshot und Audit-IDs werden über den
      Mesh-Artifactpfad zum Client zurückgegeben
    - Das Gate bleibt bei Simulator, fehlendem Developer Mode, fehlendem Trust,
      ungültigem Signing oder Mock-Ausgabe rot und nennt genau den nächsten
      Reparaturschritt
  passes: false
  needs:
    - STORY-33
  area: apple-hardware-gate
