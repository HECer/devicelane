[workspace]
members = ["."]
resolver = "2"

[package]
name = "devicelane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["HECer"]
description = "Securely route development commands, device access, logs, and artifacts across Windows, macOS, Linux, iOS, and Android hosts."
license = "MIT"
repository = "https://github.com/HECer/devicelane"
homepage = "https://github.com/HECer/devicelane"
readme = "README.md"
keywords = ["ios", "android", "remote-development", "device", "debugging"]
categories = ["development-tools"]
publish = false
exclude = [".agents/**", ".codex/**", ".yoke/**", "AGENTS.md", "RTK.md"]

[lib]
name = "device_development_mesh"
path = "src/lib.rs"

[[bin]]
name = "devicelane-service"
path = "src/bin/devicelane-service.rs"

[[bin]]
name = "devicelane"
path = "src/bin/devicelane.rs"

[dependencies]
cap-std = "3"
command-group = "5"
prost = "0.13"
sha2 = "0.10"
rand = "0.8"
rcgen = "0.13"
ring = "0.17"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

