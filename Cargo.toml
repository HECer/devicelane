[workspace]
members = ["."]
resolver = "2"

[package]
name = "device-development-mesh"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-std = "3"
command-group = "5"
prost = "0.13"
sha2 = "0.10"
rand = "0.8"
rcgen = "0.13"
ring = "0.17"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.17"

[dev-dependencies]
tempfile = "3"

