name: Desktop release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: Build signed production artifacts
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  production-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.production == true
    environment: production-release
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Require every production credential
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Refusing production release without signing and notarization inputs: $name" >&2; exit 1; }
          done

  native:
    needs: production-inputs
    if: always() && (needs.production-inputs.result == 'success' || needs.production-inputs.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi
            smoke: pwsh -File scripts/desktop-release-smoke.ps1
          - os: macos-latest
            bundles: dmg
            smoke: sh scripts/desktop-release-smoke.sh
          - os: ubuntu-latest
            bundles: appimage,deb
            smoke: sh scripts/desktop-release-smoke.sh
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Install locked release tools
        run: cargo install cargo-cyclonedx --version 0.5.7 --locked
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3
      - name: Gate platform production credentials
        if: github.event_name == 'workflow_dispatch' && inputs.production == true
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Refusing production release without signing and notarization inputs" >&2; exit 1; }
          case "$RUNNER_OS" in
            macOS) for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do test -n "${!name}" || exit 1; done ;;
            Windows) test -n "$WINDOWS_CERTIFICATE" && test -n "$WINDOWS_CERTIFICATE_PASSWORD" || exit 1 ;;
          esac
      - name: Import Apple production identity
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.production == true
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/devicelane-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/apple-signing.p12"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/apple-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Import Windows production identity
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.production == true
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'devicelane-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) | Out-Null
      - name: Build unsigned native desktop bundle
        if: github.event_name != 'workflow_dispatch' || inputs.production != true
        working-directory: desktop
        run: npm exec tauri build -- --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Build signed and notarized native desktop bundle
        if: github.event_name == 'workflow_dispatch' && inputs.production == true
        working-directory: desktop
        run: npm exec tauri build -- --bundles ${{ matrix.bundles }} -- --locked
      - name: Authenticode-sign production MSI
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.production == true
        shell: pwsh
        run: Get-ChildItem target\release\bundle\msi\*.msi | ForEach-Object { & signtool sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Validate notarization ticket
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.production == true
        shell: bash
        run: find target/release/bundle/dmg -name '*.dmg' -exec xcrun stapler validate {} \;
      - name: Verify staged sidecar hash manifest
        shell: bash
        run: |
          cd desktop/src-tauri/binaries
          sha256sum devicelane-service-* > sidecar-manifest.sha256
          sha256sum --check sidecar-manifest.sha256
          # Install roots must be signed/admin-owned and non-writable in production.
          # Hash checks reduce accidental substitution; No TOCTOU security guarantee is claimed.
      - name: Generate SBOM
        shell: bash
        run: cargo cyclonedx --all --format json && mkdir -p desktop-dist/SBOM && find . -name '*.cdx.json' -type f -exec cp {} desktop-dist/SBOM/ \;
      - name: First-run lifecycle smoke
        shell: bash
        if: runner.os != 'Windows'
        run: DEVICELANE_SERVICE_BINARY="$PWD/target/release/devicelane-service" ${{ matrix.smoke }} --exercise-lifecycle
      - name: First-run lifecycle smoke (Windows)
        if: runner.os == 'Windows'
        env:
          DEVICELANE_SERVICE_BINARY: ${{ github.workspace }}\target\release\devicelane-service.exe
        run: ${{ matrix.smoke }} -ExerciseLifecycle
      - name: Collect bundles and SHA-256 manifest
        shell: bash
        run: |
          find target/release/bundle -type f -exec cp {} desktop-dist/ \;
          cd desktop-dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload unsigned CI artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.production != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-ci-${{ runner.os }}
          path: desktop-dist
          if-no-files-found: error
          retention-days: 7
      - name: Sign production manifest
        if: github.event_name == 'workflow_dispatch' && inputs.production == true
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: cosign sign-blob --yes --bundle desktop-dist/SHA256SUMS.sigstore desktop-dist/SHA256SUMS
      - name: Upload production candidate
        if: github.event_name == 'workflow_dispatch' && inputs.production == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-candidate-${{ runner.os }}
          path: desktop-dist
          if-no-files-found: error
